<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#d43d2a">
<meta name="description" content="每日 Top10 热点新闻：国内热点与国际热点，每天自动更新。">
<title>每日热点 · Top 10</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1a1a1a;
    --sub: #8a8f99;
    --line: #eceef1;
    --accent: #d43d2a;
    --accent-soft: #fdecea;
    --rank1: #f5222d; --rank2: #fa541c; --rank3: #fa8c16;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101114; --card: #1a1c20; --text: #e8eaed;
      --sub: #9aa0a6; --line: #2a2d33;
      --accent-soft: #3a1f1c;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 12px 28px; }

  header.top {
    padding: calc(20px + env(safe-area-inset-top)) 4px 12px;
  }
  header.top h1 { font-size: 26px; font-weight: 800; letter-spacing: .5px; }
  header.top h1 .dot { color: var(--accent); }
  header.top .meta { margin-top: 6px; font-size: 13px; color: var(--sub); display: flex; align-items: center; gap: 8px; }
  header.top .meta .live { display:inline-block; width:8px; height:8px; border-radius:50%;
    background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.18); }

  nav.tabs {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; gap: 8px; padding: 10px 4px;
  }
  nav.tabs button {
    flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--sub);
    font-size: 15px; font-weight: 700; padding: 11px 0; border-radius: 12px; cursor: pointer;
    transition: all .18s ease;
  }
  nav.tabs button.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 4px 14px rgba(212,61,42,.35);
  }

  ul.list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  ul.list li a {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--card); border-radius: 14px; padding: 14px 14px;
    text-decoration: none; color: inherit;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
    transition: transform .12s ease;
  }
  ul.list li a:active { transform: scale(.985); }
  .rank {
    flex: 0 0 30px; height: 30px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: var(--sub); background: var(--bg);
  }
  .rank.r1 { background: var(--rank1); color: #fff; }
  .rank.r2 { background: var(--rank2); color: #fff; }
  .rank.r3 { background: var(--rank3); color: #fff; }
  .body { flex: 1; min-width: 0; }
  .body .title { font-size: 16px; line-height: 1.5; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .body .tags { margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--accent-soft);
    color: var(--accent); font-weight: 700; }
  .hot { font-size: 12px; color: var(--sub); }
  .arrow { flex: 0 0 auto; color: var(--sub); font-size: 18px; align-self: center; opacity: .6; }

  .state { text-align: center; padding: 48px 20px; color: var(--sub); font-size: 14px; }
  .state .spin { width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent); animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .state button {
    margin-top: 14px; border: none; background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 700; padding: 10px 26px; border-radius: 24px; cursor: pointer;
  }

  footer { margin-top: 26px; text-align: center; font-size: 12px; color: var(--sub); line-height: 1.8; }
  footer .src { display: inline-block; margin: 0 4px; padding: 2px 10px; border: 1px solid var(--line);
    border-radius: 20px; background: var(--card); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>每日热点<span class="dot"> · </span>Top 10</h1>
    <div class="meta"><span class="live"></span><span id="updateTime">正在加载…</span></div>
  </header>

  <nav class="tabs">
    <button id="tabDomestic" class="active" onclick="switchTab('domestic')">国内热点</button>
    <button id="tabWorld" onclick="switchTab('world')">国际热点</button>
  </nav>

  <ul class="list" id="newsList"></ul>
  <div class="state" id="stateBox" hidden></div>

  <footer>
    <div><span class="src">国内 · 今日头条热榜</span><span class="src">国际 · 联合早报</span></div>
    <div style="margin-top:8px">每天早上自动更新 · 点击标题查看原文</div>
  </footer>
</div>

<script>
let DATA = null;
let curTab = 'domestic';

const listEl = document.getElementById('newsList');
const stateEl = document.getElementById('stateBox');
const timeEl = document.getElementById('updateTime');

function fmtHot(n) {
  if (n == null) return '';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万热度';
  return n + '热度';
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showState(html) { stateEl.hidden = false; stateEl.innerHTML = html; listEl.innerHTML = ''; }
function hideState() { stateEl.hidden = true; }

function render() {
  if (!DATA) return;
  const items = DATA[curTab] || [];
  hideState();
  if (!items.length) {
    showState('暂无数据，请稍后再试。');
    return;
  }
  listEl.innerHTML = items.map((it, i) => {
    const rankCls = i < 3 ? 'r' + (i + 1) : '';
    const hot = it.hot ? `<span class="hot">${esc(fmtHot(it.hot))}</span>` : '';
    const tag = it.label ? `<span class="tag">${esc(it.label)}</span>` : '';
    return `<li><a href="${esc(it.url)}" target="_blank" rel="noopener">
      <span class="rank ${rankCls}">${i + 1}</span>
      <span class="body"><span class="title">${esc(it.title)}</span>
      <span class="tags">${tag}${hot}</span></span>
      <span class="arrow">›</span></a></li>`;
  }).join('');
}

function switchTab(tab) {
  curTab = tab;
  document.getElementById('tabDomestic').classList.toggle('active', tab === 'domestic');
  document.getElementById('tabWorld').classList.toggle('active', tab === 'world');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function load() {
  showState('<div class="spin"></div>正在获取今日热点…');
  try {
    const res = await fetch('data/news.json?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('http ' + res.status);
    DATA = await res.json();
    timeEl.textContent = '更新于 ' + (DATA.updated_at || '未知时间');
    render();
  } catch (e) {
    timeEl.textContent = '数据加载失败';
    showState(`网络开小差了，新闻没能加载出来。<br><button onclick="load()">重新加载</button>`);
  }
}
load();
</script>
</body>
</html>
