name: 每日更新热点新闻

on:
  schedule:
    # 每天 23:00 UTC = 北京时间次日 07:00
    - cron: "0 23 * * *"
  workflow_dispatch: {}  # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取最新热点
        run: python3 scripts/fetch_news.py

      - name: 提交更新
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "新闻无变化，跳过提交"
          else
            git commit -m "每日热点更新 $(date -u +%Y-%m-%d)"
            git push
          fi
